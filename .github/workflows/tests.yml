name: Tests

# MPI-443 made `npm test` + `npm run test:desktop` a release gate, but the gate was a
# human step in mpi-version-bump. This runs both on every push so a red suite is seen
# before a release, not during one.
#
# windows-latest runs BOTH: Electron needs no xvfb on Windows, and Playwright drives it
# through the `electron` npm binary, so there is no `npx playwright install` step.
#
# @cubric/connector is a `file:../Cubric-Studio/packages/connector` dependency and that
# sibling does not exist on a lone checkout. npm ci still exits 0 — it creates a dangling
# symlink rather than failing — and all three consumers (server.js, services/brokerBoot.js,
# services/connectorResponder.js) dynamic-import it inside try/catch and stay standalone
# when it is absent. So no PAT, no registry and no vendored copy are needed here.
# (The dangling symlink itself is a shipped-artifact problem, tracked on MPI-416.)

on:
  push:
    # Release branches are cut per version and named bare (1.3.0, 1.3.1) — a hotfix
    # landing there never touches master, so master alone would leave it untested
    # while the v* tag build still runs off it.
    branches: [master, '[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A PR run is superseded by its own next push, so cancelling it is right — group
  # those by ref. A push to master or a release branch is a permanent point in
  # history and has to get its own verdict, so give it a group of ONE (the run id):
  # it can neither cancel a running sibling nor be cancelled while queued behind one.
  #
  # Both failure modes were measured. `cancel-in-progress: true` grouped by ref meant
  # 17 of 60 master runs over two days ended cancelled with no verdict, and the commit
  # that broke the suite was rarely the one that went red — MPI-675 broke it in
  # e152cc10 (run 33489156063, cancelled a minute later) and 79faec57, a handoff
  # pointer adding one 4-line JSON file, wore the failure. Keeping the ref group and
  # setting cancel-in-progress FALSE only moves the problem: the run waits as pending
  # and the next push cancels it there instead. (MPI-676)
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm test

      # The suite takes its own free port (tests/desktop/globalSetup.js), so nothing
      # on the runner can collide with it.
      - run: npm run test:desktop

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          # Each failing spec leaves its whole Electron profile behind under
          # user-data/ — 301 MB of Chromium cache in the first red run, for zero
          # diagnostic value. The traces, screenshots and error-context are the
          # part worth downloading.
          path: |
            test-results/
            !test-results/**/user-data/**
          if-no-files-found: ignore
          retention-days: 7
